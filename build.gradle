plugins {
    id 'fabric-loom' version '1.14.1'
    id 'maven-publish'
}
version = '1.0.0-rebuild'
group = 'com.rebuild'
base { archivesName = 'VCore-Rebuild-1.21.11' }
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.1+1.21.11'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
